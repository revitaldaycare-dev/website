name: Deploy and Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment propagation
        run: sleep 30

      - name: Check apex returns 200
        run: |
          for path in "/" "/about.html" "/contact.html" "/sitemap.xml" "/robots.txt"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://revitaldaycare.com${path}")
            if [ "$code" != "200" ]; then
              echo "FAIL: ${path} returned ${code}"
              exit 1
            fi
            echo "OK: ${path} returned ${code}"
          done

      - name: Check www 301 redirect
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.revitaldaycare.com/")
          if [ "$code" != "301" ]; then
            echo "FAIL: www returned ${code}, expected 301"
            exit 1
          fi
          echo "OK: www returned 301"

      - name: Check security headers
        run: |
          headers=$(curl -s -I "https://revitaldaycare.com/")
          for header in "strict-transport-security" "content-security-policy" "x-content-type-options"; do
            if echo "$headers" | grep -qi "$header"; then
              echo "OK: $header present"
            else
              echo "FAIL: $header missing"
              exit 1
            fi
          done
